<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 64 64" fill="none" role="img" aria-labelledby="codbase-title codbase-description">
  <title id="codbase-title">Codbase, circle with hollow halo</title>
