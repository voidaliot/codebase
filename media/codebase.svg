      <stop stop-color="#8b69ce"/><stop offset="1" stop-color="#7951c3"/>
    </linearGradient>
  </defs>
  <circle id="codbase-aura" cx="32" cy="32" r="31" fill="#7951c3" fill-opacity=".13"/>
  <circle id="codbase-halo" cx="32" cy="32" r="29.5" stroke="#7951c3" stroke-width="1" stroke-opacity=".6"/>
  <circle id="codbase-disc" cx="32" cy="32" r="27" fill="url(#codbase-surface)"/>
  <g transform="translate(32 32) scale(.5)"><g transform="scale(2.3) translate(-32 -32)"><path d="m23 23-8 9 8 9m18-18 8 9-8 9m-5-22-8 26" stroke="white" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></g></g>
